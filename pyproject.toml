[project]
name = "image-retrieval-system"
version = "0.1.0"
description = "REST API truy xuất ảnh tương tự (CIFAR-10) dùng ResNet-18 + CLIP + FAISS"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Giang Lê Hoàng" }]
dependencies = [
    "fastapi==0.115.6",       # REST API + tự sinh tài liệu Swagger
    "uvicorn[standard]==0.34.0",  # ASGI server chạy FastAPI
    "python-multipart==0.0.20",   # FastAPI cần để nhận multipart/form-data (upload ảnh)
    "torch==2.4.0",
    "torchvision==0.19.0",
    "pillow==10.4.0",
    "numpy==1.26.4",
    "faiss-cpu==1.8.0",
    "packaging",       # faiss-cpu cần lúc runtime nhưng không tự khai báo
    "open-clip-torch==2.24.0",  # CLIP: tìm ảnh bằng văn bản / ảnh (offline)
    "google-genai>=0.3.0",      # Chatbot provider: Gemini (Google AI Studio) — tùy chọn
    "openai>=1.40.0",           # Chatbot provider: Azure OpenAI — tùy chọn
]

# Đây là một "application" (không phải thư viện cần build/cài thành package),
# nên không đóng gói project — uv chỉ quản lý môi trường + dependencies.
[tool.uv]
package = false

# --- Dùng wheel PyTorch CPU-only (tránh tải bản CUDA rất nặng) ---
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
